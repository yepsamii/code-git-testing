<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebContentsView Resizable Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <span class="toolbar-title">Resizable preview card</span>
    <form id="url-form" class="url-form">
      <input id="url-input" type="text" spellcheck="false" placeholder="https://example.com" />
      <button type="submit">Go</button>
    </form>
  </header>

  <main class="stage">
    <div class="card" id="card">
      <div class="card-viewport" id="card-viewport"></div>

      <div class="handle handle-n" data-dir="n"></div>
      <div class="handle handle-s" data-dir="s"></div>
      <div class="handle handle-e" data-dir="e"></div>
      <div class="handle handle-w" data-dir="w"></div>
      <div class="handle handle-ne" data-dir="ne"></div>
      <div class="handle handle-nw" data-dir="nw"></div>
      <div class="handle handle-se" data-dir="se"></div>
      <div class="handle handle-sw" data-dir="sw"></div>
    </div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
